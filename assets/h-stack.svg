<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 90" width="1000" height="90" role="img" aria-label="MY STACK"><style>@font-face{font-family:'Orb';font-weight:900;src:url(data:font/woff2;base64,) format('woff2')}</style>
<defs>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
  <feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="bigGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
<linearGradient id="gTxt" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#f5cd8a"/><stop offset=".5" stop-color="#eadfc9"/><stop offset="1" stop-color="#70d69e"/>
  <animate attributeName="x1" values="0;-1;0" dur="8s" repeatCount="indefinite"/>
  <animate attributeName="x2" values="1;2;1" dur="8s" repeatCount="indefinite"/>
</linearGradient>
<radialGradient id="panelBg" cx=".5" cy=".4" r=".8"><stop offset="0" stop-color="#14110c"/><stop offset="1" stop-color="#080706"/></radialGradient>
<linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#f5cd8a"/><stop offset=".5" stop-color="#c99a5b"/><stop offset="1" stop-color="#70d69e" stop-opacity="0"/></linearGradient>
</defs>
<image href="data:image/png;base64," x="2" y="12" width="56" height="56"/>
<text x="72" font-family="'Orb', 'Segoe UI', Arial, sans-serif" font-size="36" font-weight="900" letter-spacing="4" text-anchor="start" y="56" dx="6" dy="6" fill="#5a3e1e">MY STACK</text>
<text x="72" font-family="'Orb', 'Segoe UI', Arial, sans-serif" font-size="36" font-weight="900" letter-spacing="4" text-anchor="start" y="56" dx="5" dy="5" fill="#5a3e1e">MY STACK</text>
<text x="72" font-family="'Orb', 'Segoe UI', Arial, sans-serif" font-size="36" font-weight="900" letter-spacing="4" text-anchor="start" y="56" dx="4" dy="4" fill="#5a3e1e">MY STACK</text>
<text x="72" font-family="'Orb', 'Segoe UI', Arial, sans-serif" font-size="36" font-weight="900" letter-spacing="4" text-anchor="start" y="56" dx="3" dy="3" fill="#5a3e1e">MY STACK</text>
<text x="72" font-family="'Orb', 'Segoe UI', Arial, sans-serif" font-size="36" font-weight="900" letter-spacing="4" text-anchor="start" y="56" dx="2" dy="2" fill="#5a3e1e">MY STACK</text>
<text x="72" font-family="'Orb', 'Segoe UI', Arial, sans-serif" font-size="36" font-weight="900" letter-spacing="4" text-anchor="start" y="56" dx="1" dy="1" fill="#2a1c0e">MY STACK</text>
<text x="72" font-family="'Orb', 'Segoe UI', Arial, sans-serif" font-size="36" font-weight="900" letter-spacing="4" text-anchor="start" y="56" fill="url(#gTxt)" stroke="#fff" stroke-opacity=".25" stroke-width="1">MY STACK</text>
<rect x="74" y="72" width="600" height="3" rx="1.5" fill="url(#bar)">
  <animate attributeName="width" values="120;600;120" dur="6s" repeatCount="indefinite"/>
</rect>
</svg>