<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 250" width="480" height="250" role="img" aria-label="IoT Motion Sensor: A tiny ESP32 that snitches to Azure every time something moves. Live demo inside.">
<defs>
<linearGradient id="face" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e1b4b"/><stop offset="1" stop-color="#0b1023"/></linearGradient>
<linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
</linearGradient>
<clipPath id="clipFace"><path d="M22 36L442 22L442 197L22 211Z"/></clipPath>
<filter id="soft" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
</defs>
<style>
  .card { animation: bob 4s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-5px) } }
</style>
<ellipse cx="242.0" cy="236" rx="200" ry="10" fill="#2dd4bf" opacity=".35" filter="url(#soft)"/>
<g class="card">
  <path d="M22 211L442 197L456 211L36 225Z" fill="#2dd4bf" fill-opacity=".35"/>
  <path d="M442 22L456 36L456 211L442 197Z" fill="#2dd4bf" fill-opacity=".55"/>
  <path d="M22 36L442 22L442 197L22 211Z" fill="url(#face)" stroke="#2dd4bf" stroke-width="2"/>
  <g clip-path="url(#clipFace)">
    <rect x="-200" y="0" width="160" height="250" fill="url(#sweep)" transform="skewX(-20)">
      <animate attributeName="x" values="-200;700" dur="4.5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g transform="matrix(1 -0.0333 0 1 22 36)">
    <image href="data:image/png;base64," x="26" y="14" width="46" height="46"/>
    <text x="76" y="40" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="900" fill="#f8fafc">IoT Motion Sensor</text>
    <text x="76" y="58" font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="12" fill="#2dd4bf">ESP32 → MQTT → Azure</text>
    <text font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#cbd5e1"><tspan x="30" y="90">A tiny ESP32 that snitches to Azure every</tspan><tspan x="30" y="110">time something moves. Live demo inside.</tspan></text>
    <rect x="30" y="128" width="36.2" height="24" rx="12" fill="#2dd4bf" fill-opacity=".15" stroke="#2dd4bf" stroke-opacity=".7"/><text x="48.1" y="144.5" text-anchor="middle" font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="12" fill="#2dd4bf">C++</text><rect x="74.2" y="128" width="51" height="24" rx="12" fill="#2dd4bf" fill-opacity=".15" stroke="#2dd4bf" stroke-opacity=".7"/><text x="99.7" y="144.5" text-anchor="middle" font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="12" fill="#2dd4bf">ESP32</text><rect x="133.2" y="128" width="43.6" height="24" rx="12" fill="#2dd4bf" fill-opacity=".15" stroke="#2dd4bf" stroke-opacity=".7"/><text x="155" y="144.5" text-anchor="middle" font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="12" fill="#2dd4bf">MQTT</text><rect x="184.8" y="128" width="51" height="24" rx="12" fill="#2dd4bf" fill-opacity=".15" stroke="#2dd4bf" stroke-opacity=".7"/><text x="210.3" y="144.5" text-anchor="middle" font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="12" fill="#2dd4bf">Azure</text>
  </g>
</g>
</svg>